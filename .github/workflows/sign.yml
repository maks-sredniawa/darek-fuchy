name: sign

# Only after a merge, never on a pull request's code (ADR-0015 in maks-sredniawa/darek).
on:
  push:
    branches: [main]
    paths:
      - 'fuchy/**'
      - 'scripts/**'
      - 'keys/**'
      - '.github/workflows/sign.yml'
      - '.github/actions/check/**'

concurrency:
  group: sign
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/check

  # Its own job, so the key never shares a runner with the packages the check installs.
  sign:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - env:
          FUCHY_SIGNING_KEY: ${{ secrets.FUCHY_SIGNING_KEY }}
        run: python3 scripts/sign.py

      - run: |
          git add -A docs
          if git diff --cached --quiet; then
            echo "docs/ is already signed"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: sign fuchy'
          git push origin HEAD:main
